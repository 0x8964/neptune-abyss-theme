<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090E"/>
      <stop offset="100%" stop-color="#0D121A"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D94FF"/>
      <stop offset="55%" stop-color="#5BA6FF"/>
      <stop offset="100%" stop-color="#A3CEFF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="20" y="20" width="216" height="216" rx="44" fill="#10151E" stroke="#243044" stroke-width="3.5"/>
  <!-- Strong N -->
  <path d="M74 186 V70 h32 l58 78 V70 h30 v116 h-32 l-58-78 v78 z" fill="url(#letter)" filter="url(#glow)"/>
  <!-- Pure white depth dot -->
  <circle cx="188" cy="66" r="11" fill="#FFFFFF"/>
  <circle cx="188" cy="66" r="4.5" fill="#A3CEFF"/>
</svg>
